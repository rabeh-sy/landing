server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location ~ ^/badenjki-business/?$ {
        return 301 /$is_args$args;
    }

    location ~ ^(?<pricing_path>/(?:ar/|en/)?pricing)(?:/index\.html)?/?$ {
        root /usr/share/nginx/private;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex" always;

        if ($http_x_badenjki_pricing_access = "") {
            return 404;
        }
        if ($http_x_badenjki_pricing_access != "${BADENJKI_PRICING_ORIGIN_TOKEN}") {
            return 404;
        }

        try_files $pricing_path/index.html =404;
    }

    location ~ ^/((ar|en)/)?account-deletion(/index\.html)?/?$ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        try_files $uri/index.html $uri =404;
    }

    location ~ ^/(legal|privacy-policy)\.json$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri/index.html $uri =404;
    }
}
