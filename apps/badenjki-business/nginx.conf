# Dokploy's Traefik appends its client address as the last hop.
map $http_x_forwarded_for $traefik_client_ip {
    default "";
    ~(?:^|,\s*)(?<last_hop>[0-9a-fA-F:.]+)\s*$ $last_hop;
}

geo $traefik_client_ip $from_cloudflare {
    default 0;
    include /etc/nginx/cloudflare-ips.conf;
}

geo $from_private_network {
    default 0;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map "$from_private_network:$from_cloudflare:$http_cf_ipcountry" $pricing_allowed {
    default 0;
    "1:1:SY" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location ~ ^/badenjki-business/?$ {
        return 301 /$is_args$args;
    }

    location ~ ^/(?:ar/|en/)?pricing(?:/|$) {
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex" always;
        if ($pricing_allowed = 0) {
            return 404;
        }
        try_files $uri/index.html $uri =404;
    }

    location ~ ^/((ar|en)/)?account-deletion(/index\.html)?/?$ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        try_files $uri/index.html $uri =404;
    }

    location ~ ^/(legal|privacy-policy)\.json$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri/index.html $uri =404;
    }
}
