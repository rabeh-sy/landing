site:
  name: رابح
  site: 'https://rabeh.sy'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: O7X9f-0KkZtZYkMp7si8u7ii3gsD5BFceCURQpKqKzg

# Default SEO metadata
metadata:
  title:
    default: شركة رابح لتطوير البرمجيات في حلب
    template: '%s — رابح للتقنية'
  description: 'شركة برمجيات في حلب، سوريا. نصمم ونطور مواقع وتطبيقات وأنظمة أعمال مخصصة سريعة، آمنة، وقابلة للنمو.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: رابح
    images:
      - url: '~/assets/images/social-rabeh.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: ar
  textDirection: rtl

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-Y40B7NYV2Z'
      partytown: false

ui:
  theme: 'dark:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
